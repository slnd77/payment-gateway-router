x-app: &app
  build: .
  image: payment-gateway-router
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-pg_router}
    DB_USERNAME: ${DB_USERNAME:-pg_router}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:80"

  queue:
    <<: *app
    environment:
      CONTAINER_ROLE: queue
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-pg_router}
      DB_USERNAME: ${DB_USERNAME:-pg_router}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-pg_router}
      DB_USERNAME: ${DB_USERNAME:-pg_router}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pg_router}
      MYSQL_USER: ${DB_USERNAME:-pg_router}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db:
  storage:
